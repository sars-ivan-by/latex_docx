[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-docx"
version = "0.1.0"
description = "LaTeX → DOCX converter with TD-J journal formatting, OMML math, and DOCX diff"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ivan Sukach" }]
keywords = ["latex", "docx", "omml", "td-j", "scientific-publishing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
  "python-docx>=1.0",
]

[project.optional-dependencies]
omml = [
  "latex2mathml>=3.77",
  "mathml2omml>=0.0.2",
]
dev = [
  "pytest>=7",
  "latex-docx[omml]",
]

[project.scripts]
latex-docx = "latex_docx.cli:main"

[project.urls]
Homepage = "https://github.com/sars-ivan-by/latex_docx"
Repository = "https://github.com/sars-ivan-by/latex_docx"

[tool.setuptools.packages.find]
include = ["latex_docx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
