[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-docx"
version = "0.2.0"
description = "LaTeX and Markdown to DOCX or PPTX, with TD-J layout, OMML math, and DOCX diff"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ivan Sukach" }]
keywords = ["latex", "markdown", "docx", "pptx", "pdf", "omml", "td-j", "scientific-publishing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: LaTeX",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "python-docx>=1.0",
]

[project.optional-dependencies]
omml = [
  "latex2mathml>=3.77",
  "mathml2omml>=0.0.2",
]
pptx = [
  "python-pptx>=1.0",
]
win = [
  "pywin32>=306; sys_platform == 'win32'",
]
dev = [
  "pytest>=7",
  "latex-docx[omml,pptx]",
]

[project.scripts]
latex-docx = "latex_docx.cli:main"

[project.urls]
Homepage = "https://github.com/sars-ivan-by/latex_docx"
Documentation = "https://sars-ivan-by.github.io/latex_docx/"
Repository = "https://github.com/sars-ivan-by/latex_docx"
Issues = "https://github.com/sars-ivan-by/latex_docx/issues"
Changelog = "https://github.com/sars-ivan-by/latex_docx/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["latex_docx*"]

[tool.setuptools.package-data]
latex_docx = ["py.typed", "*.applescript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
